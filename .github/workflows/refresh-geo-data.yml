name: Refresh geo data (MRT stations, schools)

# Separate from refresh-data.yml's twice-weekly cadence on purpose --
# MRT stations change maybe quarterly and schools maybe yearly, and the
# school geocoding step alone takes a few minutes (OneMap rate limits
# unauthenticated search traffic), so running it twice a week would just
# waste CI time and hammer OneMap for no reason.
on:
  schedule:
    - cron: "0 21 1 * *" # 1st of each month, 21:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch MRT/LRT station locations from LTA
        run: python scripts/fetch_mrt_stations.py

      - name: Fetch and geocode school locations from MOE
        run: python scripts/fetch_schools.py

      - name: Geocode supply-pipeline projects for the Map page
        run: |
          # Reads data/raw/pipeline_ura_api.json as committed by
          # refresh-data.yml's own twice-weekly run -- no need to hit
          # URA's own API again here, this workflow just adds locations.
          if [ -f data/raw/pipeline_ura_api.json ]; then
            python scripts/fetch_supply_locations.py
          else
            echo "No pipeline_ura_api.json yet -- skipping until refresh-data.yml has run with URA_ACCESS_KEY set."
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "prowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh geo data $(date -u +%Y-%m-%d)"
          git push
